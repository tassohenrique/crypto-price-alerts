name: Worker

# Roda um ciclo do worker sob demanda (botão "Run workflow" na aba Actions).
# O agendamento a cada 15 min saiu daqui: num teste de ~20 h, o GitHub rodou só
# 4 das ~80 execuções previstas, com intervalos de 3 a 6 h. Quem agenda agora é
# o cron-job.org, chamando POST /internal/run-cycle na API.
on:
  workflow_dispatch:

# Nunca dois workers ao mesmo tempo: se uma execução atrasar, a próxima espera
# na fila em vez de rodar junto (dois ciclos juntos poderiam avisar em dobro).
concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  run-cycle:
    name: Run one cycle
    # Forks não herdam os segredos; o agendamento só faz sentido no original.
    if: github.repository == 'tassohenrique/crypto-price-alerts'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      # Enquanto os segredos não forem cadastrados, a execução termina verde com
      # um aviso, em vez de falhar (e mandar e-mail de falha) a cada 15 minutos.
      - name: Check secrets
        id: secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::Segredos do worker não cadastrados; ciclo pulado."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-python@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      # Só as dependências de produção, como na imagem.
      - name: Install dependencies
        if: steps.secrets.outputs.ready == 'true'
        run: pip install -r requirements.txt

      - name: Run worker once
        if: steps.secrets.outputs.ready == 'true'
        run: python -m app.worker --once
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # O worker não usa a chave da API, mas a configuração exige a variável.
          # Valor falso: a chave real não precisa existir em mais um lugar.
          API_KEY: not-used-by-the-worker
          LOG_FORMAT: json
