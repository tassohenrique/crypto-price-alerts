name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: crypto
          POSTGRES_PASSWORD: crypto_ci_password
          POSTGRES_DB: crypto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crypto -d crypto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Valores falsos: nenhum teste chama a CoinGecko ou o Telegram de verdade.
    # Os segredos reais nunca ficam no GitHub.
    env:
      DATABASE_URL: postgresql+psycopg://crypto:crypto_ci_password@localhost:5432/crypto
      TEST_DATABASE_URL: postgresql+psycopg://crypto:crypto_ci_password@localhost:5432/crypto_test
      COINGECKO_API_KEY: ci-fake-coingecko-key
      TELEGRAM_BOT_TOKEN: ci-fake-telegram-token
      TELEGRAM_CHAT_ID: "0"
      API_KEY: ci-fake-api-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Create test database
        run: createdb -h localhost -U crypto crypto_test
        env:
          PGPASSWORD: crypto_ci_password

      - name: Apply migrations on an empty database
        run: alembic upgrade head

      - name: Run tests with coverage
        run: pytest -q --cov=app --cov-report=term-missing